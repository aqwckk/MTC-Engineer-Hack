---
# Метрики приложения: nginx-prometheus-exporter (sidecar) в подах web-v1 / web-v2.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web
  namespace: demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  targetLabels:
    - app.kubernetes.io/version
  endpoints:
    - port: metrics
      interval: 15s
---
# HTTP-метрики data-plane Gateway API (Envoy): RPS, коды ответов, latency.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
---
# Метрики control-plane Envoy Gateway.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      control-plane: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Метрики конвейера логов (Fluentd): принятые/отправленные записи, ошибки, буферы.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fluentd
  namespace: logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Метрики cert-manager (сроки действия и статус сертификатов).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: http-metrics
      interval: 60s
