---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - httproutes.yaml
  - monitors.yaml
  - alerts.yaml
configMapGenerator:
  - name: dashboard-demo-overview
    namespace: monitoring
    files:
      - dashboards/demo-overview.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
