# Конвейер логов: контейнеры (CRI) -> парсинг -> обогащение -> Elasticsearch.

<system>
  log_level info
</system>

# Метрики самого Fluentd для Prometheus
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>
<source>
  @type prometheus_monitor
</source>
<source>
  @type prometheus_output_monitor
</source>

# Источник 1: логи демонстрационного приложения (namespace demo)
<source>
  @type tail
  @id in_tail_app
  path /var/log/containers/web-*_demo_*.log
  pos_file /var/log/fluentd-demo-app.pos
  tag kube.app.*
  read_from_head true
  <parse>
    @type cri
  </parse>
</source>

# Источник 2: access-логи Gateway (Envoy)
<source>
  @type tail
  @id in_tail_gateway
  # только контейнер envoy в подах data-plane (envoy-<namespace>-<gateway>-...)
  path /var/log/containers/envoy-edge-*_envoy-gateway-system_envoy-*.log
  pos_file /var/log/fluentd-demo-gateway.pos
  tag kube.gateway.*
  read_from_head true
  <parse>
    @type cri
  </parse>
</source>

# Метаданные Kubernetes: pod, namespace, labels, узел
<filter kube.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  skip_labels false
  skip_container_metadata true
  skip_master_url true
</filter>

# access-лог nginx и Envoy пишется в JSON — разворачиваем его в поля.
# Нераспознанные строки (error-лог nginx) сохраняются как есть в поле message.
<filter kube.**>
  @type parser
  @id filter_json
  key_name message
  reserve_data true
  reserve_time true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key __none__
  </parse>
</filter>

# Тип записи: access (stdout nginx), error (stderr nginx), exporter
<filter kube.app.**>
  @type record_transformer
  enable_ruby true
  <record>
    log_type ${record.dig("kubernetes", "container_name") == "nginx" ? (record["stream"] == "stdout" ? "access" : "error") : "exporter"}
  </record>
</filter>
<filter kube.gateway.**>
  @type record_transformer
  <record>
    log_type gateway
  </record>
</filter>

<match kube.app.**>
  @type elasticsearch
  @id out_es_app
  host "#{ENV['ELASTICSEARCH_HOST']}"
  port 9200
  scheme http
  user "#{ENV['ELASTICSEARCH_USER']}"
  password "#{ENV['ELASTICSEARCH_PASSWORD']}"
  logstash_format true
  logstash_prefix app-logs
  suppress_type_name true
  verify_es_version_at_startup false
  default_elasticsearch_version 8
  template_name demo-logs
  template_file /fluentd/etc/index-template.json
  use_legacy_template false
  template_overwrite true
  max_retry_putting_template 30
  fail_on_putting_template_retry_exceed false
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 15s
  <buffer>
    @type file
    path /var/log/fluentd-buffers/demo-app
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 2M
    total_limit_size 256M
    retry_type exponential_backoff
    retry_max_interval 30s
    retry_forever true
    overflow_action drop_oldest_chunk
  </buffer>
</match>

<match kube.gateway.**>
  @type elasticsearch
  @id out_es_gateway
  host "#{ENV['ELASTICSEARCH_HOST']}"
  port 9200
  scheme http
  user "#{ENV['ELASTICSEARCH_USER']}"
  password "#{ENV['ELASTICSEARCH_PASSWORD']}"
  logstash_format true
  logstash_prefix gateway-logs
  suppress_type_name true
  verify_es_version_at_startup false
  default_elasticsearch_version 8
  template_name demo-logs
  template_file /fluentd/etc/index-template.json
  use_legacy_template false
  template_overwrite true
  max_retry_putting_template 30
  fail_on_putting_template_retry_exceed false
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 15s
  <buffer>
    @type file
    path /var/log/fluentd-buffers/demo-gateway
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 2M
    total_limit_size 256M
    retry_type exponential_backoff
    retry_max_interval 30s
    retry_forever true
    overflow_action drop_oldest_chunk
  </buffer>
</match>
