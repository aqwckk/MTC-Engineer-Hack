# Две версии одного приложения (stable и canary) для демонстрации traffic splitting.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/version: v1
spec:
  # число реплик (2..5) задаёт HorizontalPodAutoscaler web-v1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/version: v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
              app.kubernetes.io/version: v1
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          env:
            # не писать служебные сообщения entrypoint в stdout (там только access-лог)
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
            - name: APP_VERSION
              value: v1
            - name: APP_MESSAGE
              value: "Hello World!"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: template
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: empty
              mountPath: /usr/share/nginx/empty
              readOnly: true
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: template
          configMap:
            name: web-nginx-template
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: empty
          emptyDir: {}
---
