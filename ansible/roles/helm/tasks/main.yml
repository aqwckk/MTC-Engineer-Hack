---
- name: Проверить установленную версию Helm
  ansible.builtin.command: /usr/local/bin/helm version --template '{{ "{{.Version}}" }}'
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Установить Helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ deb_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - "linux-{{ deb_arch }}/helm"
    extra_opts:
      - --strip-components=1
    mode: "0755"
  when: helm_installed.rc != 0 or helm_installed.stdout != helm_version
