---
- name: Установить базовые пакеты
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - conntrack
      - socat
      - ipset
      - jq
      - openssl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Отключить swap (требование kubelet)
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Убрать swap из /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Настроить автозагрузку модулей ядра
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Загрузить модули ядра
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Настроить параметры ядра
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
    # требуется Elasticsearch
    - { name: vm.max_map_count, value: "262144" }
    # запас для tail-источников Fluentd и большого числа контейнеров
    - { name: fs.inotify.max_user_instances, value: "8192" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
